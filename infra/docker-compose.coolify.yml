# ClassIQ on Coolify (Docker Compose build pack). See docs/agents/deployment.md → "Deploying on Coolify".
# Coolify's Traefik terminates TLS for the domain assigned to `router`; nothing else is exposed.
# Coolify runs compose with the repo root as the project directory, so build contexts are `.`; locally use
#   docker compose --project-directory . -f infra/docker-compose.coolify.yml ...
# Set these in Coolify → Environment variables:
#   PUBLIC_ORIGIN, POSTGRES_PASSWORD, REDIS_PASSWORD, JWT_SECRET, SARVAM_API_KEY, OPENAI_API_KEY
#   (REDIS_PASSWORD goes into a URL and a redis.conf line: use hex or base64, e.g. openssl rand -hex 32)
#   optional: AUDIO_RETENTION_DAYS, GENERATION_CONCURRENCY, LOG_LEVEL,
#             SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, MAIL_FROM (email invites, resets, reminders),
#             DEMO_REQUEST_TO (inbox for /about "Book a demo" requests; default: MAIL_FROM's address)
#   platform console: PLATFORM_ENCRYPTION_KEY (required: openssl rand -base64 32), PLATFORM_ORIGIN
#             (e.g. https://ops.example.org) + PLATFORM_HOST (ops.example.org; also add that domain to `router`),
#             COOLIFY_API_URL, COOLIFY_API_TOKEN, COOLIFY_APP_UUID (deployments page; read + deploy token)
#   old school address (optional): LEGACY_HOST (e.g. old.example.org; keep that domain on `router`): its pages
#             redirect to PUBLIC_ORIGIN, /api stays served for devices still pointing there
#   push notifications (optional): VAPID_PUBLIC_KEY + VAPID_PRIVATE_KEY (npx web-push generate-vapid-keys),
#             VAPID_SUBJECT (default mailto:admin@benxsolutions.in)
#   object storage (Garage, the `storage` service): GARAGE_RPC_SECRET (required: openssl rand -hex 32),
#             GARAGE_ADMIN_TOKEN (required: openssl rand -base64 32), S3_ACCESS_KEY_ID (echo "GK$(openssl rand -hex 12)"),
#             S3_SECRET_ACCESS_KEY (openssl rand -hex 32); optional GARAGE_CAPACITY (default 50G), S3_BUCKET
#             (default classpulse). STORAGE_DRIVER stays `local` until the files are migrated: see
#             docs/agents/deployment.md → "Object storage (Garage)".
#
# Hardening (every service): no-new-privileges, all Linux capabilities dropped (Postgres and Redis get back
# only what their entrypoints need to chown the data directory and drop to their own user), and memory/CPU
# caps sized for the 12 GB / 4 OCPU ARM server (total about 6.9 GB, leaving room for Coolify and the page
# cache). Base images are pinned by tag + digest; Dependabot proposes updates.

x-logging: &logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '5'

x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile

# Environment shared by the API and the worker. The worker does not get the Coolify API credentials (only the
# API's deployments page uses them). PLATFORM_ENCRYPTION_KEY stays on both: the worker never decrypts anything,
# but config/env.ts refuses to start any production process without a valid key.
x-worker-env: &worker-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://classpulse:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/classpulse
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (>=32 random chars)}
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN, e.g. https://classiq.example.org}
  # Two proxies sit in front of the API: Coolify's Traefik (adds the client address to X-Forwarded-For)
  # and the router (Caddy, which trusts Traefik and appends Traefik's address). Express walks back exactly
  # two hops to find the client, so anything a client writes into X-Forwarded-For itself is ignored. Change
  # this only together with `trusted_proxies` in infra/Caddyfile.coolify: too high lets clients spoof their
  # IP, too low makes every visitor share Traefik's address (and every rate limit).
  TRUST_PROXY_HOPS: 2
  # Stored files: `local` = the storage_data volume under STORAGE_DIR; `s3` = the Garage bucket below. Flip to
  # s3 only after the migration in docs/agents/deployment.md → "Object storage (Garage)".
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  STORAGE_DIR: /data/storage
  # Uploads in progress, transcodes and S3 downloads; always local disk (its own volume, swept hourly).
  TMP_DIR: /data/tmp
  S3_ENDPOINT: http://storage:3900
  S3_BUCKET: ${S3_BUCKET:-classpulse}
  S3_REGION: garage
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  AUDIO_RETENTION_DAYS: ${AUDIO_RETENTION_DAYS:-30}
  SARVAM_API_KEY: ${SARVAM_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  GENERATION_CONCURRENCY: ${GENERATION_CONCURRENCY:-1}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-465}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  MAIL_FROM: ${MAIL_FROM:-}
  PLATFORM_ORIGIN: ${PLATFORM_ORIGIN:-}
  PLATFORM_ENCRYPTION_KEY: ${PLATFORM_ENCRYPTION_KEY:?set PLATFORM_ENCRYPTION_KEY (openssl rand -base64 32)}

x-api-env: &api-env
  <<: *worker-env
  COOLIFY_API_URL: ${COOLIFY_API_URL:-}
  COOLIFY_API_TOKEN: ${COOLIFY_API_TOKEN:-}
  COOLIFY_APP_UUID: ${COOLIFY_APP_UUID:-}
  DEMO_REQUEST_TO: ${DEMO_REQUEST_TO:-}
  # Web Push (phone/desktop notifications): off while the private key is empty. npx web-push generate-vapid-keys
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@benxsolutions.in}

services:
  postgres:
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_USER: classpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: classpulse
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U classpulse -d classpulse']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1536m
    cpus: 2
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    # The entrypoint starts as root, fixes ownership and permissions of the data directory, then su-execs
    # to the postgres user.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    logging: *logging

  redis:
    image: redis:7.4.11-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
    restart: unless-stopped
    # The password goes into a 0600 config file (owned by the redis user) at start-up instead of
    # `--requirepass <password>`, so it is not part of the container's command (`docker inspect`, `ps`).
    # docker-entrypoint.sh then drops to the redis user as usual.
    command:
      - sh
      - -c
      - |
        umask 077
        printf 'requirepass "%s"\n' "$$REDIS_PASSWORD" > /tmp/redis-auth.conf
        chown redis:redis /tmp/redis-auth.conf
        exec docker-entrypoint.sh redis-server /tmp/redis-auth.conf --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      # REDISCLI_AUTH keeps the password off redis-cli's command line.
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 384m
    cpus: 1
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    # chown of /data and the config file, then su-exec to the redis user.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    logging: *logging

  api:
    image: classiq-api:latest
    build: *api-build
    restart: unless-stopped
    # Migrations run before the API starts (idempotent), so there is no one-shot container for Coolify to
    # report as exited. The worker waits for the API to be healthy, i.e. for the schema to be current.
    command: ['sh', '-c', 'node dist/db/migrate.js && exec node dist/server.js']
    environment: *api-env
    volumes:
      # storage_data stays mounted while files are migrated to Garage (and for a week after the switch).
      - storage_data:/data/storage
      - tmp_data:/data/tmp
      # Host backups (infra/backup.sh), read-only, for the platform health page's backup age check.
      - /var/backups/classpulse:/backups:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_healthy
    # A cap turns a runaway request (e.g. a document decompression bomb) into one restarted container
    # instead of an out-of-memory host.
    mem_limit: 1536m
    cpus: 2
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    logging: *logging

  worker:
    image: classiq-api:latest
    build: *api-build
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    environment: *worker-env
    volumes:
      - storage_data:/data/storage
      - tmp_data:/data/tmp
    depends_on:
      api:
        condition: service_healthy
      storage-init:
        condition: service_healthy
    healthcheck:
      disable: true
    # ffmpeg (audio normalisation) runs here.
    mem_limit: 2g
    cpus: 2
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    logging: *logging

  # Garage: S3-compatible object storage for stored files (lesson audio, Pi recordings, submissions,
  # materials). Internal only: no ports published, no domain in Coolify; the API is the only client and
  # still serves every file itself. Config baked into the image (infra/garage/garage.toml): other containers
  # can reach only the S3 API (:3900); the admin API and RPC listen on the container's loopback.
  # GARAGE_* secrets go to this service and storage-init only, never to api/worker/web.
  storage:
    image: classiq-storage:latest
    build:
      context: .
      dockerfile: infra/garage/Dockerfile
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET (openssl rand -hex 32)}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN (openssl rand -base64 32)}
      # The health check's `garage status` logs a connection every 15 s at INFO; keep those quiet.
      RUST_LOG: garage=info,garage_net=warn,garage_api_admin=warn
    volumes:
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      # The image is FROM scratch (no shell): the garage CLI checks the daemon answers on RPC.
      test: ['CMD', '/garage', 'status']
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    # Runs as uid 10001 (see the Dockerfile); idles at ~20 MB, upload buffers are capped at 128 MiB.
    read_only: true
    mem_limit: 512m
    cpus: 1
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    logging: *logging

  # Idempotent setup through Garage's admin API: cluster layout, bucket, application key and its read/write
  # grant (infra/garage/init.sh). It then stays up and healthy (INIT_THEN_WAIT) because Coolify reports an
  # exited one-shot container as a failed service; api and worker start only once it is healthy.
  # Garage's admin API and RPC listen on its loopback only, so no other container can reach them; this one
  # shares Garage's network namespace to get at the admin API (Coolify then adds no networks to it).
  storage-init:
    image: classiq-storage-init:latest
    build:
      context: .
      dockerfile: infra/garage/init.Dockerfile
    restart: unless-stopped
    network_mode: 'service:storage'
    environment:
      INIT_THEN_WAIT: '1'
      GARAGE_ADMIN_URL: http://127.0.0.1:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN (openssl rand -base64 32)}
      # Only validated here (64 hex characters), so a bad value fails with a readable message.
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET (openssl rand -hex 32)}
      GARAGE_CAPACITY: ${GARAGE_CAPACITY:-50G}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_BUCKET: ${S3_BUCKET:-classpulse}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    depends_on:
      storage:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'test', '-f', '/tmp/storage-init.done']
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=1m
    mem_limit: 32m
    cpus: 0.25
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    logging: *logging

  web:
    image: classiq-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:5000
      KEEP_ALIVE_TIMEOUT: '75000' # longer than the proxy's 30 s pooled-connection keepalive
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 768m
    cpus: 1
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    logging: *logging

  router:
    image: classiq-router:latest
    build:
      context: .
      dockerfile: infra/router.Dockerfile
    restart: unless-stopped
    environment:
      # Coolify: the public domain(s) are attached to this service on port 80. The router runs as an
      # unprivileged user and still binds :80 (Docker allows unprivileged low ports inside containers),
      # so the Coolify domain mapping does not change.
      SERVICE_FQDN_ROUTER_80: ''
      # The platform console's host name; /platform is 404 on every other host.
      PLATFORM_HOST: ${PLATFORM_HOST:-platform.invalid}
      # A previous school host name: pages redirect to PUBLIC_ORIGIN, /api and /socket.io are still served.
      LEGACY_HOST: ${LEGACY_HOST:-legacy.invalid}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN, e.g. https://classiq.example.org}
    depends_on:
      - web
      - api
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:80/api/health/live >/dev/null || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
    # Stateless (no certificates: Traefik terminates TLS), so the filesystem is read-only.
    read_only: true
    tmpfs:
      - /tmp
      - /data:uid=10001,gid=10001,mode=0700
      - /config:uid=10001,gid=10001,mode=0700
    mem_limit: 256m
    cpus: 1
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    logging: *logging

volumes:
  pg_data:
  redis_data:
  storage_data:
  tmp_data:
  garage_meta:
  garage_data:
