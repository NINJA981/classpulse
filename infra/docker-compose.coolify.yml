# ClassPulse on Coolify (Docker Compose build pack). See docs/deployment.md → "Deploying on Coolify".
# Coolify's Traefik terminates TLS for the domain assigned to `router`; nothing else is exposed.
# Coolify runs compose with the repo root as the project directory, so build contexts are `.`; locally use
#   docker compose --project-directory . -f infra/docker-compose.coolify.yml ...
# Set these in Coolify → Environment variables:
#   PUBLIC_ORIGIN, POSTGRES_PASSWORD, REDIS_PASSWORD, JWT_SECRET, SARVAM_API_KEY, OPENAI_API_KEY
#   (REDIS_PASSWORD goes into a URL and a redis.conf line: use hex or base64, e.g. openssl rand -hex 32)
#   optional: AUDIO_RETENTION_DAYS, GENERATION_CONCURRENCY, LOG_LEVEL,
#             SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, MAIL_FROM (email invites, resets, reminders)
#   platform console: PLATFORM_ENCRYPTION_KEY (required: openssl rand -base64 32), PLATFORM_ORIGIN
#             (e.g. https://ops.example.org) + PLATFORM_HOST (ops.example.org; also add that domain to `router`),
#             COOLIFY_API_URL, COOLIFY_API_TOKEN, COOLIFY_APP_UUID (deployments page; read + deploy token)
#
# Hardening (every service): no-new-privileges, all Linux capabilities dropped (Postgres and Redis get back
# only what their entrypoints need to chown the data directory and drop to their own user), and memory/CPU
# caps sized for the 12 GB / 4 OCPU ARM server (total about 6.4 GB, leaving room for Coolify and the page
# cache). Base images are pinned by tag + digest; Dependabot proposes updates.

x-logging: &logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '5'

x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile

# Environment shared by the API and the worker. The worker does not get the Coolify API credentials (only the
# API's deployments page uses them). PLATFORM_ENCRYPTION_KEY stays on both: the worker never decrypts anything,
# but config/env.ts refuses to start any production process without a valid key.
x-worker-env: &worker-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://classpulse:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/classpulse
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (>=32 random chars)}
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN, e.g. https://classpulse.example.org}
  # Two proxies sit in front of the API: Coolify's Traefik (adds the client address to X-Forwarded-For)
  # and the router (Caddy, which trusts Traefik and appends Traefik's address). Express walks back exactly
  # two hops to find the client, so anything a client writes into X-Forwarded-For itself is ignored. Change
  # this only together with `trusted_proxies` in infra/Caddyfile.coolify: too high lets clients spoof their
  # IP, too low makes every visitor share Traefik's address (and every rate limit).
  TRUST_PROXY_HOPS: 2
  STORAGE_DIR: /data/storage
  AUDIO_RETENTION_DAYS: ${AUDIO_RETENTION_DAYS:-30}
  SARVAM_API_KEY: ${SARVAM_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  GENERATION_CONCURRENCY: ${GENERATION_CONCURRENCY:-1}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-465}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  MAIL_FROM: ${MAIL_FROM:-}
  PLATFORM_ORIGIN: ${PLATFORM_ORIGIN:-}
  PLATFORM_ENCRYPTION_KEY: ${PLATFORM_ENCRYPTION_KEY:?set PLATFORM_ENCRYPTION_KEY (openssl rand -base64 32)}

x-api-env: &api-env
  <<: *worker-env
  COOLIFY_API_URL: ${COOLIFY_API_URL:-}
  COOLIFY_API_TOKEN: ${COOLIFY_API_TOKEN:-}
  COOLIFY_APP_UUID: ${COOLIFY_APP_UUID:-}

services:
  postgres:
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_USER: classpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: classpulse
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U classpulse -d classpulse']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1536m
    cpus: 2
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    # The entrypoint starts as root, fixes ownership and permissions of the data directory, then su-execs
    # to the postgres user.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    logging: *logging

  redis:
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    # The password goes into a 0600 config file (owned by the redis user) at start-up instead of
    # `--requirepass <password>`, so it is not part of the container's command (`docker inspect`, `ps`).
    # docker-entrypoint.sh then drops to the redis user as usual.
    command:
      - sh
      - -c
      - |
        umask 077
        printf 'requirepass "%s"\n' "$$REDIS_PASSWORD" > /tmp/redis-auth.conf
        chown redis:redis /tmp/redis-auth.conf
        exec docker-entrypoint.sh redis-server /tmp/redis-auth.conf --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      # REDISCLI_AUTH keeps the password off redis-cli's command line.
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 384m
    cpus: 1
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    # chown of /data and the config file, then su-exec to the redis user.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    logging: *logging

  api:
    image: classpulse-api:latest
    build: *api-build
    restart: unless-stopped
    # Migrations run before the API starts (idempotent), so there is no one-shot container for Coolify to
    # report as exited. The worker waits for the API to be healthy, i.e. for the schema to be current.
    command: ['sh', '-c', 'node dist/db/migrate.js && exec node dist/server.js']
    environment: *api-env
    volumes:
      - storage_data:/data/storage
      # Host backups (infra/backup.sh), read-only, for the platform health page's backup age check.
      - /var/backups/classpulse:/backups:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # A cap turns a runaway request (e.g. a document decompression bomb) into one restarted container
    # instead of an out-of-memory host.
    mem_limit: 1536m
    cpus: 2
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    logging: *logging

  worker:
    image: classpulse-api:latest
    build: *api-build
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    environment: *worker-env
    volumes:
      - storage_data:/data/storage
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      disable: true
    # ffmpeg (audio normalisation) runs here.
    mem_limit: 2g
    cpus: 2
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    logging: *logging

  web:
    image: classpulse-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:5000
      KEEP_ALIVE_TIMEOUT: '75000' # longer than the proxy's 30 s pooled-connection keepalive
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 768m
    cpus: 1
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    logging: *logging

  router:
    image: classpulse-router:latest
    build:
      context: .
      dockerfile: infra/router.Dockerfile
    restart: unless-stopped
    environment:
      # Coolify: the public domain(s) are attached to this service on port 80. The router runs as an
      # unprivileged user and still binds :80 (Docker allows unprivileged low ports inside containers),
      # so the Coolify domain mapping does not change.
      SERVICE_FQDN_ROUTER_80: ''
      # The platform console's host name; /platform is 404 on every other host.
      PLATFORM_HOST: ${PLATFORM_HOST:-platform.invalid}
    depends_on:
      - web
      - api
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:80/api/health/live >/dev/null || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
    # Stateless (no certificates: Traefik terminates TLS), so the filesystem is read-only.
    read_only: true
    tmpfs:
      - /tmp
      - /data:uid=10001,gid=10001,mode=0700
      - /config:uid=10001,gid=10001,mode=0700
    mem_limit: 256m
    cpus: 1
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    logging: *logging

volumes:
  pg_data:
  redis_data:
  storage_data:
