name: classpulse-admin

services:
  # ================================================
  # 1. Admin Portal Service (Port 5173)
  # ================================================
  admin_portal:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: classpulse_admin_5173
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_APP_ROLE=admin
    command: npm run dev:admin

  # ================================================
  # 2. Admin Login Portal Service (Port 5171)
  # ================================================
  admin_login:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: classpulse_admin_login_5171
    ports:
      - "5171:5171"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_APP_ROLE=admin-login
    command: npm run dev:admin-login

  # ================================================
  # 3. Production Web Server (Port 8080)
  # ================================================
  prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: classpulse_prod
    ports:
      - "8080:80"
    restart: unless-stopped
