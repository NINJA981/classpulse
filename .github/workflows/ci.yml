name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the GITHUB_TOKEN: every job only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party code is pinned: actions by full commit SHA (the tag is in the comment), tool images by digest.
# Dependabot (.github/dependabot.yml) proposes updates for the actions.
env:
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: classpulse
          POSTGRES_PASSWORD: classpulse
          POSTGRES_DB: classpulse_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U classpulse" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://classpulse:classpulse@localhost:5432/classpulse_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @classiq/shared
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -w @classiq/api
      - run: npm run build -w @classiq/web

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: pip install pytest
      - run: python -m pytest apps/classroom-agent/tests -q

  # Secrets in the full git history. Reviewed false positives are listed by fingerprint in .gitleaksignore.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE"
          git /repo --redact --no-banner --gitleaks-ignore-path /repo/.gitleaksignore

  # Known production advisories. The gate is `critical` on purpose: the open `high` advisories
  # (image-size via pptxgenjs, sprintf-js/argparse via mammoth; audit L11) are not reachable in production, and
  # npm's suggested fixes are breaking downgrades. A `high` gate would fail every build until upstream ships
  # fixes; Dependabot raises those updates instead. The full report is still printed for review.
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: npm audit (report)
        run: npm audit --omit=dev || true
      - name: npm audit (gate on critical)
        run: npm audit --omit=dev --audit-level=critical

  images:
    runs-on: ubuntu-latest
    needs: [checks, agent]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: docker build -f apps/api/Dockerfile -t classiq-api:ci .
      - run: docker build -f apps/web/Dockerfile -t classiq-web:ci .
      - run: docker build -f infra/router.Dockerfile -t classiq-router:ci .
      # Image vulnerabilities (OS packages and node_modules). Blocking only on CRITICAL issues that have a fix;
      # HIGH is reported without failing the build.
      - name: Trivy (report HIGH and CRITICAL)
        run: |
          for image in classiq-api:ci classiq-web:ci classiq-router:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache "$TRIVY_IMAGE" \
              image --scanners vuln --severity HIGH,CRITICAL --no-progress "$image"
          done
      - name: Trivy (gate on fixable CRITICAL)
        run: |
          for image in classiq-api:ci classiq-web:ci classiq-router:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache "$TRIVY_IMAGE" \
              image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$image"
          done
