# ClassPulse production stack for a single VPS.
#   cp infra/.env.example infra/.env   # fill in every value
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env up -d --build
# Only Caddy publishes ports (80/443). Everything else is on the private network.
# Hardening as in docker-compose.coolify.yml: no-new-privileges, all capabilities dropped (Postgres, Redis and
# Caddy get back only what they need), memory/CPU caps, base images pinned by tag + digest.
name: classpulse

x-logging: &logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '5'

x-api-env: &api-env
  NODE_ENV: production
  # Caddy is the edge and replaces any client-sent X-Forwarded-For, so the API trusts exactly one hop.
  TRUST_PROXY_HOPS: 1
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://classpulse:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/classpulse
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (>=32 random chars)}
  PUBLIC_ORIGIN: https://${DOMAIN:?set DOMAIN}
  STORAGE_DIR: /data/storage
  AUDIO_RETENTION_DAYS: ${AUDIO_RETENTION_DAYS:-30}
  SARVAM_API_KEY: ${SARVAM_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  GENERATION_CONCURRENCY: ${GENERATION_CONCURRENCY:-2}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-465}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  MAIL_FROM: ${MAIL_FROM:-}
  PLATFORM_ORIGIN: ${PLATFORM_HOST:+https://${PLATFORM_HOST}}
  PLATFORM_ENCRYPTION_KEY: ${PLATFORM_ENCRYPTION_KEY:?set PLATFORM_ENCRYPTION_KEY (openssl rand -base64 32)}

services:
  postgres:
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_USER: classpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: classpulse
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U classpulse -d classpulse']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1536m
    cpus: 2
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    # The entrypoint fixes ownership of the data directory as root, then su-execs to postgres.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    logging: *logging

  redis:
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    # The password goes into a 0600 config file at start-up instead of `--requirepass <password>`, so it is
    # not part of the container's command (`docker inspect`, `ps`). The entrypoint then drops to redis.
    command:
      - sh
      - -c
      - |
        umask 077
        printf 'requirepass "%s"\n' "$$REDIS_PASSWORD" > /tmp/redis-auth.conf
        chown redis:redis /tmp/redis-auth.conf
        exec docker-entrypoint.sh redis-server /tmp/redis-auth.conf --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    mem_limit: 384m
    cpus: 1
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    logging: *logging

  migrate:
    image: classpulse-api:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ['node', 'dist/db/migrate.js']
    environment: *api-env
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    logging: *logging

  api:
    image: classpulse-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment: *api-env
    volumes:
      - storage_data:/data/storage
      # Host backups (infra/backup.sh), read-only, for the platform health page's backup age check.
      - ${BACKUP_DIR:-/var/backups/classpulse}:/backups:ro
    networks: [internal]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: 1536m
    cpus: 2
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    logging: *logging

  worker:
    image: classpulse-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    environment: *api-env
    volumes:
      - storage_data:/data/storage
    networks: [internal]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    # ffmpeg (audio normalisation) runs here.
    mem_limit: 2g
    cpus: 2
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    logging: *logging

  web:
    image: classpulse-web:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:5000
      KEEP_ALIVE_TIMEOUT: '75000' # longer than the proxy's 30 s pooled-connection keepalive
    networks: [internal]
    depends_on:
      - api
    mem_limit: 768m
    cpus: 1
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    logging: *logging

  caddy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN}
      PLATFORM_HOST: ${PLATFORM_HOST:-platform.localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]
    depends_on:
      - web
      - api
    mem_limit: 256m
    cpus: 1
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    # The stock image's caddy binary carries a cap_net_bind_service file capability; exec fails unless that
    # capability is in the bounding set. (The Coolify router image strips it and runs as non-root instead;
    # this one stays root because its certificate volumes are root-owned.)
    cap_add: [NET_BIND_SERVICE]
    logging: *logging

volumes:
  pg_data:
  redis_data:
  storage_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
